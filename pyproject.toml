[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offramp"
version = "0.1.0"
description = "Prove you can leave your frontier model: replay real LLM traffic on open-weight models through Otari, then ship the routing policy the evidence earned."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
offramp = "offramp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
